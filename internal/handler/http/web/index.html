<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trial Booking — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight">Trial Booking</h1>
      <p class="text-slate-500 mt-1">Trial class booking system demo — parent booking &amp; admin roster.</p>
    </header>

    <!-- Tabs -->
    <div class="flex gap-2 mb-6">
      <button id="tab-parent" class="px-4 py-2 rounded-md font-medium bg-slate-900 text-white">Parent Booking</button>
      <button id="tab-admin"
        class="px-4 py-2 rounded-md font-medium bg-white border border-slate-300 text-slate-700">Admin Roster</button>
    </div>

    <!-- Parent Booking Tab -->
    <section id="panel-parent">
      <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
          <h2 class="text-lg font-semibold mb-4">Book a Trial Class</h2>

          <label class="block text-sm font-medium text-slate-600 mb-1">Parent</label>
          <select id="parent-select" class="w-full mb-4 border border-slate-300 rounded-md px-3 py-2"></select>

          <label class="block text-sm font-medium text-slate-600 mb-1">Child</label>
          <select id="child-select"
            class="w-full mb-4 border border-slate-300 rounded-md px-3 py-2 disabled:bg-slate-100" disabled></select>

          <label class="block text-sm font-medium text-slate-600 mb-1">Class</label>
          <select id="class-select"
            class="w-full mb-4 border border-slate-300 rounded-md px-3 py-2 disabled:bg-slate-100" disabled></select>

          <button id="book-btn"
            class="w-full bg-slate-900 text-white rounded-md py-2 font-medium hover:bg-slate-800 disabled:opacity-50"
            disabled>Book Trial Class</button>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
          <h2 class="text-lg font-semibold mb-4">Booking Result</h2>
          <div id="booking-result" class="text-sm text-slate-500">No booking yet.</div>

          <div id="payment-controls" class="hidden mt-6">
            <h3 class="text-sm font-medium text-slate-600 mb-2">Mock Payment</h3>
            <div class="flex gap-3">
              <button id="pay-success-btn"
                class="flex-1 bg-emerald-600 text-white rounded-md py-2 font-medium hover:bg-emerald-700">Pay
                Success</button>
              <button id="pay-failure-btn"
                class="flex-1 bg-red-600 text-white rounded-md py-2 font-medium hover:bg-red-700">Pay Failure</button>
            </div>
          </div>

          <div id="payment-result" class="mt-6 text-sm"></div>
        </div>
      </div>
    </section>

    <!-- Admin Roster Tab -->
    <section id="panel-admin" class="hidden">
      <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
        <h2 class="text-lg font-semibold mb-1">Class Roster</h2>
        <p class="text-sm text-slate-500 mb-4">All bookings for the class. Only confirmed bookings count toward capacity.</p>

        <div class="flex gap-3 mb-6">
          <select id="roster-class-select" class="flex-1 border border-slate-300 rounded-md px-3 py-2"></select>
          <button id="roster-btn"
            class="bg-slate-900 text-white rounded-md px-4 py-2 font-medium hover:bg-slate-800 disabled:opacity-50">Load
            Roster</button>
        </div>

        <div id="roster-summary" class="text-sm text-slate-600 mb-4"></div>
        <div id="roster-table" class="text-sm text-slate-500">Select a class and load the roster.</div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>

</html>
